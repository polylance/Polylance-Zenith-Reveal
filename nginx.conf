server {
    listen 80;
    server_name polylancezenith.com www.polylancezenith.com;
    return 301 https://polylancezenith.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name polylancezenith.com www.polylancezenith.com;

    root /usr/share/nginx/html;
    index index.html;

    # SSL configuration (insert certificates)
    # ssl_certificate /etc/letsencrypt/live/polylancezenith.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/polylancezenith.com/privkey.pem;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://polylancezenith.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header Access-Control-Expose-Headers "Date" always;

    # HTML files: never cache so server Date header is always fresh
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # Static assets: immutable long-term caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ════════════════════════════════════════════════════════════
    # REVEAL DAY MIGRATION SWITCH (17 December 2026, 12:00 AM IST)
    # ════════════════════════════════════════════════════════════
    # When reveal time is reached, comment the "location /" block above
    # and uncomment the permanent 301 redirect block below:
    #
    # location / {
    #     return 301 https://polylancezenith.com$request_uri;
    # }
}

